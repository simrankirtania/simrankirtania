<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simran Kirtania's GitHub stats">
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/><stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6ec7"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="rGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="roundedCard"><rect width="495" height="195" rx="18"/></clipPath>
  </defs>
  <style>
    .statRow { opacity: 0; }
    .barFill { }
    text { font-family: 'Poppins','Segoe UI',sans-serif; }
  </style>
  <g clip-path="url(#roundedCard)">
